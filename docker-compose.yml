services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: researchgpt-backend
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-llama-3.3-70b-versatile}
    volumes:
      # Mount prebuilt ChromaDB vector database and benchmark metrics
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - researchgpt-network
    # Port 8000 is intentionally NOT bound to host interfaces.
    # All inbound client requests pass through the Nginx reverse proxy.

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: researchgpt-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - researchgpt-network

networks:
  researchgpt-network:
    driver: bridge
